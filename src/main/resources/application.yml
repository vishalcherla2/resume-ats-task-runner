spring:
  application:
    name: resume-ats-task-runner

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/resume_ats_task_runner
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

task-runner:
  max-concurrency: 2
  scheduler-delay: 1000